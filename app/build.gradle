plugins { id 'com.android.application' }
android {
    namespace 'com.onedayonemasterpiece.repeatit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.onedayonemasterpiece.repeatit'
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(':core')
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'com.google.code.gson:gson:2.13.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
tasks.register('generateChime', Exec) { commandLine 'python3', rootProject.file('tools/generate_chime.py') }
preBuild.dependsOn generateChime
