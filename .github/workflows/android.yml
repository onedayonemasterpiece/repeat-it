name: Android verified build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Core, Android lint, unsigned release and emulator test APK
        run: gradle --no-daemon :core:check :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            core/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  emulator:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: apks
      - name: Enable hardware acceleration on hosted emulator only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.onedayonemasterpiece.repeatit.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ github.run_number }}
          path: instrumentation.txt
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: apks
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Prepare installable APK
        env:
          KEYSTORE: ${{ secrets.REPEAT_IT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REPEAT_IT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPEAT_IT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p release
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/repeat-it.p12"
            trap 'rm -f "$RUNNER_TEMP/repeat-it.p12"' EXIT
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 apks/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repeat-it.p12" --ks-key-alias repeat-it --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/repeat-it.apk "$RUNNER_TEMP/aligned.apk"
            APK=release/repeat-it.apk
            KIND=permanent
            TAG="v0.1.$GITHUB_RUN_NUMBER"
          else
            cp apks/debug/app-debug.apk release/repeat-it-dev.apk
            APK=release/repeat-it-dev.apk
            KIND=debug
            TAG="v0.1.$GITHUB_RUN_NUMBER-dev"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > release/CERTIFICATE.txt
          (cd release && sha256sum "$(basename "$APK")" > SHA256SUMS)
          printf 'source_sha=%s\nversion_code=%s\nversion_name=0.1.%s\nrun_id=%s\nsigning=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" "$KIND" > release/BUILD.txt
          echo "release_tag=$TAG" >> "$GITHUB_ENV"
          echo "release_kind=$KIND" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: repeat-it-installable-${{ github.run_number }}
          path: release/
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$release_kind" = debug ]; then
            NOTES='Hosted build and Android 15 emulator checks passed. This APK uses the build debug signature for first-device acceptance; a later permanent-signing migration may require reinstall. Physical USB acceptance and battery measurement are not asserted by CI.'
          else
            NOTES='Hosted build and Android 15 emulator checks passed. APK uses the configured permanent signing identity. Physical USB acceptance and battery measurement are separate.'
          fi
          gh release create "$release_tag" release/* --target "$GITHUB_SHA" --title "Повторение 0.1.$GITHUB_RUN_NUMBER ($release_kind)" --notes "$NOTES"
