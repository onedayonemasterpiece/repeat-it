name: Android verified build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Core, Android lint, unsigned release and emulator test APK
        run: gradle --no-daemon :core:check :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            core/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  emulator:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: apks
      - name: Enable KVM for Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Pixel 7 Android 15 native lifecycle and overlay stress
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -timezone Etc/UTC
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.onedayonemasterpiece.repeatit android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.onedayonemasterpiece.repeatit SYSTEM_ALERT_WINDOW allow
            adb shell appops get com.onedayonemasterpiece.repeatit SYSTEM_ALERT_WINDOW
            adb shell am instrument -w -e class com.onedayonemasterpiece.repeatit.StorageCycleTest com.onedayonemasterpiece.repeatit.test/androidx.test.runner.AndroidJUnitRunner | tee storage-cycle.txt
            grep -q 'OK (1 test)' storage-cycle.txt
            adb shell am force-stop com.onedayonemasterpiece.repeatit || true
            adb shell pm clear com.onedayonemasterpiece.repeatit
            adb shell pm grant com.onedayonemasterpiece.repeatit android.permission.POST_NOTIFICATIONS || true
            adb shell appops set com.onedayonemasterpiece.repeatit SYSTEM_ALERT_WINDOW allow
            adb shell appops get com.onedayonemasterpiece.repeatit SYSTEM_ALERT_WINDOW
            adb shell am instrument -w -e class com.onedayonemasterpiece.repeatit.OverlayStressTest com.onedayonemasterpiece.repeatit.test/androidx.test.runner.AndroidJUnitRunner | tee overlay-stress.txt
            adb pull /sdcard/Android/data/com.onedayonemasterpiece.repeatit/files/overlay-stress-debug.txt overlay-stress-debug.txt || true
            adb pull /sdcard/Android/data/com.onedayonemasterpiece.repeatit/files/overlay-window-hierarchy.xml overlay-window-hierarchy.xml || true
            adb pull /sdcard/Android/data/com.onedayonemasterpiece.repeatit/files/shareable-overlay.png shareable-overlay.png || true
            adb shell appops get com.onedayonemasterpiece.repeatit > appops.txt
            adb shell dumpsys window windows > window-evidence.txt
            adb shell dumpsys activity services com.onedayonemasterpiece.repeatit > service-evidence.txt
            adb shell dumpsys activity activities > activity-evidence.txt
            adb shell pidof com.onedayonemasterpiece.repeatit > pid-evidence.txt || true
            grep -q 'OK (1 test)' overlay-stress.txt
            adb pull /sdcard/Android/data/com.onedayonemasterpiece.repeatit/files/overlay-stress-summary.txt overlay-stress-summary.txt
            grep -q '^result=PASS$' overlay-stress-summary.txt
            grep -q '^cycles=40$' overlay-stress-summary.txt
            grep -q '^events=40$' overlay-stress-summary.txt
            grep -q '^delayed_pending_checks=3$' overlay-stress-summary.txt
            grep -q '^screen_off_on=2$' overlay-stress-summary.txt
            grep -q '^protected_settings_transitions=2$' overlay-stress-summary.txt
            grep -q '^rotations=1$' overlay-stress-summary.txt
            grep -q '^finite_session=1$' overlay-stress-summary.txt
            grep -q '^stateful_pause_control=1$' overlay-stress-summary.txt
            grep -q '^auto_active_without_enable=1$' overlay-stress-summary.txt
            grep -q '^primary_controls_visible_without_scroll=1$' overlay-stress-summary.txt
            grep -q '^test_mode_indicator=1$' overlay-stress-summary.txt
            grep -q '^agent_debug_manual_step=1$' overlay-stress-summary.txt
            grep -q '^screenshot_shareable=1$' overlay-stress-summary.txt
            test -s shareable-overlay.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ github.run_number }}
          path: |
            storage-cycle.txt
            overlay-stress.txt
            overlay-stress-debug.txt
            overlay-window-hierarchy.xml
            overlay-stress-summary.txt
            shareable-overlay.png
            appops.txt
            window-evidence.txt
            service-evidence.txt
            activity-evidence.txt
            pid-evidence.txt
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install-and-emulator-${{ github.run_number }}
          path: apks
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Prepare installable APK
        env:
          KEYSTORE: ${{ secrets.REPEAT_IT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REPEAT_IT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPEAT_IT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p release
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/repeat-it.p12"
            trap 'rm -f "$RUNNER_TEMP/repeat-it.p12"' EXIT
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 apks/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repeat-it.p12" --ks-key-alias repeat-it --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/repeat-it.apk "$RUNNER_TEMP/aligned.apk"
            APK=release/repeat-it.apk
            KIND=permanent
            TAG="v0.1.$GITHUB_RUN_NUMBER"
          else
            cp apks/debug/app-debug.apk release/repeat-it-dev.apk
            APK=release/repeat-it-dev.apk
            KIND=debug
            TAG="v0.1.$GITHUB_RUN_NUMBER-dev"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > release/CERTIFICATE.txt
          (cd release && sha256sum "$(basename "$APK")" > SHA256SUMS)
          printf 'source_sha=%s\nversion_code=%s\nversion_name=0.1.%s\nrun_id=%s\nsigning=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" "$KIND" > release/BUILD.txt
          echo "release_tag=$TAG" >> "$GITHUB_ENV"
          echo "release_kind=$KIND" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: repeat-it-installable-${{ github.run_number }}
          path: release/
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$release_kind" = debug ]; then
            NOTES='Hosted build, Android 15 transaction test and 40-cycle native overlay stress passed. Normal mode has an adaptive 15-to-5-minute attention floor between completed contacts; one pending card still blocks every other card. Agent debug is explicit-step only, test mode is visible/escapable in the owner UI, cards are screenshotable, and the PAT entry dialog remains protected. This APK uses a temporary build debug signature.'
          else
            NOTES='Hosted build, Android 15 transaction test and 40-cycle native overlay stress passed. Normal mode has an adaptive 15-to-5-minute attention floor between completed contacts; one pending card still blocks every other card. Agent debug is explicit-step only, test mode is visible/escapable in the owner UI, cards are screenshotable, and the PAT entry dialog remains protected. APK uses the configured permanent signing identity.'
          fi
          gh release create "$release_tag" release/* --target "$GITHUB_SHA" --title "Повторение 0.1.$GITHUB_RUN_NUMBER ($release_kind)" --notes "$NOTES"
