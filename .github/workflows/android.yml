name: Android verified build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Core, Android lint, unsigned release and emulator test APK
        run: gradle --no-daemon :core:check :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            core/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-and-emulator-only-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  emulator:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-and-emulator-only-${{ github.run_number }}
          path: apks
      - name: Enable hardware acceleration on hosted emulator only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.onedayonemasterpiece.repeatit.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ github.run_number }}
          path: instrumentation.txt
  sign:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-and-emulator-only-${{ github.run_number }}
          path: apks
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Permanent signing key required; never invent a debug release key
        env:
          KEYSTORE: ${{ secrets.REPEAT_IT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REPEAT_IT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.REPEAT_IT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'BLOCKED_SIGNING: configure permanent Repeat It signing secrets. No signed release was produced.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/repeat-it.p12"
          trap 'rm -f "$RUNNER_TEMP/repeat-it.p12"' EXIT
          mkdir -p release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 apks/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/repeat-it.p12" --ks-key-alias repeat-it --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out release/repeat-it.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/repeat-it.apk > release/CERTIFICATE.txt
          (cd release && sha256sum repeat-it.apk > SHA256SUMS)
          printf 'source_sha=%s\nversion_code=%s\nversion_name=0.1.%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" > release/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repeat-it-signed-${{ github.run_number }}
          path: release/
      - name: Publish exact signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1.$GITHUB_RUN_NUMBER" release/* --target "$GITHUB_SHA" --title "Повторение 0.1.$GITHUB_RUN_NUMBER" --notes "Hosted build and emulator checks passed. Physical USB acceptance and battery measurement are separate; this release does not assert them."
